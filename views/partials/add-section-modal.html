<div id="modal" class="modal hidden">

  <div class="modal-content">

    <h2>Add Section</h2>

    <form action="/sections" method="POST">

      <input
        type="text"
        name="title"
        placeholder="Section title"
        required
      >

      <textarea
        name="description"
        placeholder="Section description"
      ></textarea>

      <button type="submit">
        Save Section
      </button>

    </form>

  </div>

</div>
