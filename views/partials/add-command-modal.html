<div id="commandModal" class="modal hidden">

  <div class="modal-content">

    <h2>Add Command</h2>

    <form action="/commands" method="POST">

      <input
        type="hidden"
        id="sectionIdInput"
        name="section_id"
      >

<textarea
  name="command"
  class="auto-grow command-input"
  placeholder="docker command"
  required
></textarea>

      <textarea
        name="description"
        placeholder="Command description"
      ></textarea>

      <button type="submit">
        Save Command
      </button>

    </form>

  </div>

</div>
